{% extends "auctions/layout.html" %}

{% block body %}

    <h2>Create new listing</h2>

    {% if message %}
        <div>{{ message }}</div>
    {% endif %}

    <form action="{% url 'create' %}" method="post">
        {% csrf_token %}
        <div class="form-group">
            <input class="form-control" autofocus type="text" name="title" placeholder="Title">
        </div>

        <div class="form-group">
            <textarea class="form-control" name="description" placeholder="Description"></textarea>
        </div>

        <div class="form-group">
            <input class="form-control" type="number" name="bid" placeholder="Bid" step="0.01" min="0">
        </div>

        <div class="form-group">
            <input class="form-control" autofocus type="text" name="image_url" placeholder="Image url">
        </div>

        <div class="form-group">
            <select class="form-control" name="category">
                <option value="" selected>No category</option>
                {% for category in categories %}
                    <option value="{{ category.id }}">{{ category.name }}</option>
                {% endfor %}
            </select>
        </div>

        <input class="btn btn-primary" type="submit" value="Create">
    </form>

{% endblock %}
